<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes App</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="main-header">
  <h1>🍳 My Recipes</h1>
  <input type="text" id="search" placeholder="Search recipes...">
  <button onclick="randomRecipe()">🎲 Random Recipe</button>
</header>

<h2 id="favorites-title">❤️ Favorite Recipes</h2>
<ul id="favorites-list"></ul>

<section id="categories">
  <button onclick="filterRecipes('All')">All</button>
  <button onclick="filterRecipes('Desserts')">Desserts</button>
  <button onclick="filterRecipes('Breakfast')">Breakfast</button>
  <button onclick="filterRecipes('fastfood')">fastfood</button>
  <button onclick="filterRecipes('Pasta')">Pasta</button>
  <button onclick="filterRecipes('soups')">soups</button>
  <button onclick="filterRecipes('salads')">salads</button>
  <button onclick="filterRecipes('juices')">juices</button>
</section>

<section id="recipes-container"></section>

<ul id="favorites-list"></ul>

<!-- Recipe detail container -->
<div id="recipe-detail" style="display:none;"></div>

<script src="script.js"></script>
<script src="recipe.js"></script>
</body>
</html>
